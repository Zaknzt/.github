name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: []
body:
  - type: input
    id: project
    attributes:
      label: Project / addon
      description: Which addon, GearSwap project, or tool is affected?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Version, tag, commit, or release if known.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant Windower, GearSwap, job, zone, or setup context.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / screenshots / additional evidence
      description: Sanitize private information before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, tokens, credentials, and unrelated personal information.
          required: true
